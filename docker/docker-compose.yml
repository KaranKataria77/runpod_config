services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-monitoring-stack:latest
    container_name: vllm-stack
    init: true
    environment:
      NUM_GPUS: ${NUM_GPUS:?set NUM_GPUS, e.g. NUM_GPUS=4}
      VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY, e.g. VLLM_API_KEY=anything-secure}
      GF_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD}
      HF_HOME: /workspace/hf_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${NUM_GPUS}
              capabilities: [gpu]
    ports:
      - "8000:8000"    # vLLM API
      - "3000:3000"    # Grafana
      - "9090:9090"    # Prometheus
      - "3100:3100"    # Loki
      - "9080:9080"    # Promtail
    volumes:
      - hf-cache:/workspace/hf_cache
      - models:/workspace/models
      - ./var/log/vllm.log:/var/log/vllm.log
      - ./var/log/prometheus.log:/var/log/prometheus.log
      - ./var/log/loki.log:/var/log/loki.log
      - ./var/log/promtail.log:/var/log/promtail.log
      - ./var/log/grafana.log:/var/log/grafana.log
    shm_size: "16gb"

volumes:
  hf-cache:
  models:
