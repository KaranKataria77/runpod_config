auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  # Set via LOKI_PATH_PREFIX env var and `-config.expand-env=true` (see start.sh)
  path_prefix: ${LOKI_PATH_PREFIX}
  storage:
    filesystem:
      chunks_directory: ${LOKI_PATH_PREFIX}/chunks
      rules_directory: ${LOKI_PATH_PREFIX}/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 168h

compactor:
  working_directory: ${LOKI_PATH_PREFIX}/compactor
  retention_enabled: true
  delete_request_store: filesystem
